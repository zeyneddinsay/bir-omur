name: bir_omur
description: "Bir Ömür: Türkiye'de geçen kart tabanlı hayat simülasyonu."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  hive_ce: ^2.21.0
  hive_ce_flutter: ^2.4.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/registry.json
    - assets/cards/
    - assets/careers/
    - assets/achievements.json
